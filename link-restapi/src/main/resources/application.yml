# HTTP 业务进程配置
server:
  port: ${API_PORT:8080}

spring:
  application:
    name: link-restapi
  cloud:
    nacos:
      discovery:
        # 注册到 Nacos，供网关经服务发现（lb://link-restapi）路由
        server-addr: ${NACOS_ADDR:106.52.57.213:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
  # 推送发布端：HTTP 动作触发的在线推送发到 RabbitMQ，由持连的 Netty 进程消费下发。
  rabbitmq:
    host: ${RABBITMQ_HOST:106.52.57.213}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:Rq9#mW2$xK7@nP4vL6#jT8!s}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 发布确认：确保推送指令成功落到 broker（失败可感知，避免静默丢指令）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mongodb:
    # 本地开发直连：directConnection=true 让驱动只连下面这个地址，不做副本集拓扑发现。
    # 必须如此——副本集成员在 rs.conf() 里登记的是云服务器内网地址 172.16.0.8，
    # 若进入副本集模式（带 replicaSet 参数），驱动会转去连内网地址，本地不可达 → Connect timed out。
    # 注意：1) 密码里的 # 转义为 %23  2) /im 是业务库，authSource=admin 是认证库，两者不同
    # 取舍：直连失去故障自动切换；且需保证连的是 PRIMARY 节点（27017），否则写操作/事务会失败。
    uri: ${MONGO_URI:mongodb://admin:f3Kx%239mPqL2vNzR7wYcJ4sBt@106.52.57.213:27017/im?authSource=admin&directConnection=true&serverSelectionTimeoutMS=20000&connectTimeoutMS=20000}

