# HTTP 业务进程配置
server:
  port: ${API_PORT:8080}

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        # 暴露 health, info, prometheus 等端点（生产环境建议通过防火墙限制访问）
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      # 为所有指标添加应用标识，便于 Prometheus 中区分不同服务
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
  prometheus:
    metrics:
      export:
        enabled: true

# 腾讯云 TRTC / IM 配置（群通话用）
link:
  trtc:
    sdk-app-id: ${TRTC_SDK_APP_ID:1600159836}
    # 应用密钥：必须通过环境变量注入，切勿把真实值写进本文件提交到仓库。
    # 它一旦泄露，任何人都能签出任意 userID 的凭证，以他人身份登录腾讯云 IM。
    secret-key: ${TRTC_SECRET_KEY:0ec68ecb2350650c508a3320fa12e36389788159204b4060fa764dd1a467b42f}
    # UserSig 有效期（秒）。签发后无法撤销，时长即风险窗口，默认 24 小时。
    expire-seconds: ${TRTC_EXPIRE_SECONDS:86400}

spring:
  application:
    name: link-restapi
  cloud:
    nacos:
      discovery:
        # 注册到 Nacos，供网关经服务发现（lb://link-restapi）路由
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:175.178.245.39}
      password: K9mP#xL2@wT6yU5zB
    mongodb:
      auto-index-creation: true
      representation:
        big-decimal: decimal128
  # 推送发布端：HTTP 动作触发的在线推送发到 RabbitMQ，由持连的 Netty 进程消费下发。
  rabbitmq:
    host: ${RABBITMQ_HOST:175.178.245.39}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:Rq9#mW2$xK7@nP4vL6#jT8!s}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 发布确认：确保推送指令成功落到 broker（失败可感知，避免静默丢指令）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mongodb:
    uri: ${MONGO_URI:mongodb://admin:f3Kx#9mPqL2vNzR7wYcJ4sBt@175.178.245.39:27017,175.178.245.39:27018,175.178.245.39:27019/im?replicaSet=rs0&authSource=admin&readPreference=secondaryPreferred&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=5000&maxPoolSize=200&minPoolSize=20}

