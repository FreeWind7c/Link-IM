# Netty 接入进程配置
spring:
  application:
    name: link-server-starter
  data:
    redis:
      host: ${REDIS_HOST:localhost}
    mongodb:
      representation:
        # 必须和 link-restapi 保持一致：两个进程读写的是同一批文档。
        # 本进程虽然不做 $inc，但会落红包消息（RedPacketData.amount 也是 BigDecimal），
        # 一边写 Decimal128 一边写 String 的话，同一个字段在库里就出现两种 BSON 类型。
        big-decimal: decimal128
  mongodb:
    # 连接池与超时必须设上限：Mongo 在公网单节点，压测时驱动默认 maxPoolSize=100
    # 加上 20s 的超时，等于「连接只堆不失败」，最后把 Mongo 自己压死。
    #   maxPoolSize=50        并发写上限，超出的在驱动侧排队而不是继续开连接
    #   waitQueueTimeoutMS    等连接超过 2s 就快速失败，不无限期挂着
    #   serverSelectionTimeoutMS / connectTimeoutMS  20s → 3s，Mongo 挂了要立刻知道
    #   socketTimeoutMS       单次操作上限，防止一个慢查询占着连接不放
    uri: ${MONGO_URI:mongodb://admin:f3Kx%239mPqL2vNzR7wYcJ4sBt@42.193.160.18:27017/im?authSource=admin&directConnection=true&serverSelectionTimeoutMS=3000&connectTimeoutMS=3000&socketTimeoutMS=5000&maxPoolSize=50&minPoolSize=5&waitQueueTimeoutMS=2000}
  # 推送消费端：link-consumer 的 @RabbitListener 在本进程消费 DirectPushCommand，
  # 经 LinkMessageSender 用本进程 sessionMap 中的 Channel 真正下发（消费者必须与 Channel 同 JVM）。
  # fanout 广播 + 本节点专属临时队列（见 PushMqConfig）：在线推送可丢，故用自动 ack，无需手动 ack/DLX。
  rabbitmq:
    host: ${RABBITMQ_HOST:42.193.160.18}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:Rq9#mW2$xK7@nP4vL6#jT8!s}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        # 落库消费端的限速闸门。这两个值决定「MQ 里的积压以多快的速率打到 Mongo」——
        # 也就是削峰效果到底有多少。Mongo 是公网单节点、maxPoolSize=50，
        # 每条消息 2 次操作（insert + updateSession），并发给到 8 已经够用。
        #
        # prefetch 别给大：manual ack 下每个消费者最多预取这么多条未确认消息，
        # 给太大等于把队列积压提前搬进进程内存，削峰的意义就没了。
        #
        # 注意 PushMessageListener 用 ackMode="MANUAL" 在方法上覆盖了上面的 auto，
        # 那两个落库监听器走的是手动确认（失败 requeue，不丢消息）。
        concurrency: 4
        max-concurrency: 8
        prefetch: 20

# 日志：appender 侧已在 logback-spring.xml 改成 AsyncAppender，业务线程不再抢 console 锁。
# 压测时建议把业务包再降一档，连"塞队列"这点开销也省掉（每条消息 2~3 行 INFO，量级不小）：
#   logging.level.com.link=WARN
logging:
  level:
    com.link: INFO

# 开启 Netty 接入服务（DefaultServer 仅在该开关为 true 的进程中启动）
link:
  netty:
    enabled: true
    # 端口等其余参数见 LinkCoreConfig 默认值，可按 link.* 前缀覆盖
