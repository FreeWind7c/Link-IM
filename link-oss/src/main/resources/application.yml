# OSS 资源服务配置（独立 HTTP 进程）
server:
  port: ${API_PORT:9000}

spring:
  application:
    name: link-oss
  cloud:
    nacos:
      discovery:
        # 注册到 Nacos，供网关经服务发现（lb://link-oss）路由
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        enabled: false
  servlet:
    multipart:
      # 单文件 / 单次请求的上传大小上限，按需调整
      max-file-size: ${OSS_MAX_FILE_SIZE:20MB}
      max-request-size: ${OSS_MAX_REQUEST_SIZE:20MB}

# 腾讯云 COS：密钥务必走环境变量，不要把真实值写进仓库
link:
  oss:
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-guangzhou}
      bucket-name: ${COS_BUCKET_NAME:link-im-1313131537}
      # 访问域名前缀，不带末尾斜杠；如 https://<bucket>.cos.<region>.myqcloud.com 或 CDN 域名
      base-url: ${COS_BASE_URL:https://link-im-1313131537.cos.ap-guangzhou.myqcloud.com}
      # 对象 key 目录前缀，可空
      path-prefix: ${COS_PATH_PREFIX:im}
